# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site - 网站基本信息配置
title: 举个栗子  # 网站标题
subtitle: ''  # 网站副标题
description: ''  # 网站描述，用于SEO
keywords:  # 网站关键词，用于SEO
author: 举个栗子  # 网站作者
language: zh-CN  # 网站语言
timezone: Asia/Shanghai  # 网站时区

# URL - URL配置
url: https://jugelizi.top  # 网站URL地址
permalink: :year/:month/:day/:title/  # 文章永久链接格式
permalink_defaults:  # 永久链接的默认值
pretty_urls:  # 美化URL设置
  trailing_index: true  # 是否在目录URL后添加 index.html
  trailing_html: true  # 是否在URL后添加 .html

# Directory - 目录配置
source_dir: source  # 源文件目录
public_dir: public  # 生成的静态文件目录
tag_dir: tags  # 标签目录
archive_dir: archives  # 归档目录
category_dir: categories  # 分类目录
code_dir: downloads/code  # 代码下载目录
i18n_dir: :lang  # 国际化文件目录
skip_render:  # 跳过渲染的文件或目录
  - CNAME

# Writing - 写作配置
new_post_name: :title.md  # 新文章的文件名格式
default_layout: post  # 默认布局
titlecase: false  # 是否将标题转换为标题格式
external_link:  # 外部链接配置
  enable: true  # 是否在新标签页中打开外部链接
  field: site  # 应用范围：site（全站）或 post（仅文章）
  exclude: ''  # 排除的域名
filename_case: 0  # 文件名大小写：0=不转换，1=小写，2=大写
render_drafts: false  # 是否渲染草稿
post_asset_folder: true  # 是否为每篇文章创建资源文件夹
relative_link: false  # 是否使用相对链接
future: true  # 是否发布未来日期的文章
syntax_highlighter: highlight.js  # 代码高亮引擎
highlight:  # highlight.js 配置
  line_number: true  # 显示行号
  auto_detect: false  # 自动检测语言
  tab_replace: ''  # 替换制表符
  wrap: true  # 是否换行
  hljs: false  # 是否使用 hljs 类
prismjs:  # Prism.js 配置
  preprocess: true  # 预处理
  line_number: true  # 显示行号
  tab_replace: ''  # 替换制表符

# Home page setting - 首页设置
index_generator:  # 首页生成器配置
  path: ''  # 首页路径
  per_page: 10  # 每页显示的文章数量
  order_by: -date  # 排序方式：-date 表示按日期降序

# Category & Tag - 分类和标签配置
default_category: uncategorized  # 默认分类
category_map:  # 分类映射
tag_map:  # 标签映射

# 分类生成器配置
category_generator:  # 分类页面生成器配置
  per_page: 10        # 每页显示的文章数量
  order_by: -date     # 排序方式：-date 表示按日期降序
  
# Metadata elements - 元数据元素
meta_generator: true  # 是否在HTML中生成meta generator标签

# Date / Time format - 日期/时间格式
date_format: YYYY-MM-DD  # 日期格式
time_format: HH:mm:ss  # 时间格式
updated_option: 'mtime'  # 更新时间的来源：mtime（文件修改时间）或 date（Front Matter中的date）

# Pagination - 分页配置
per_page: 10  # 每页显示的文章数量
pagination_dir: page  # 分页目录

# Include / Exclude file(s) - 包含/排除文件
include:  # 包含的文件或目录
exclude:  # 排除的文件或目录
ignore:  # 忽略的文件或目录

# Extensions - 扩展配置
theme: butterfly  # 使用的主题名称

# Deployment - 部署配置
deploy:  # 部署设置
  type: git  # 部署类型：git
  repository: git@github.com:3417725275/3417725275.github.io.git  # Git仓库地址
  branch: master  # 部署分支
